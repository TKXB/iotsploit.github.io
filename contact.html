<!DOCTYPE html>
<html>
<head>
    <meta name="robots" content="noindex, nofollow">
    <title>Contact Information</title>
    <!-- Colour scheme. Must run before any stylesheet so the stored choice is on
         <html> for the first paint, otherwise a dark page flashes white. -->
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="https://static.configcdn.com/assets/application-ddac0561840033feb98c86d461b8c83db6a233c14ccf4e2bb7c2709253a52e05.css" media="all" data-turbo-track="reload" />
    <style>
      /* This page has no stylesheet of its own beyond the vendor reset, so the
         design system's tokens carry it. */
      body { background: var(--surface-page); color: var(--text-body); }
      h1 { color: var(--text-heading); }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <p>Feel free to reach out to us with any questions or inquiries.</p>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>
        <button type="submit">Submit</button>
    </form>

    <div id="footer-placeholder"></div>

    <script defer>
      (function(){
        fetch('footer.html', { credentials: 'same-origin' })
          .then(function(r){ return r.text(); })
          .then(function(html){
            var placeholder = document.getElementById('footer-placeholder');
            if (!placeholder) return;
            placeholder.innerHTML = html;
            var lang = localStorage.getItem('language');
            if (typeof changeLanguage === 'function' && lang) {
              changeLanguage(lang);
            }
          })
          .catch(function(){ /* ignore footer load failure */ });
      })();
    </script>
</body>
</html>
